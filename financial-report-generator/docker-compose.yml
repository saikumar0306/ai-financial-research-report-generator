version: '3.9'

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bull_ai_backend
    ports:
      - "8000:7860"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8000
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/generated_reports:/app/backend/generated_reports
      - ./backend/charts:/app/backend/charts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Uncomment for development (live reload frontend separately)
